[project]
name = "GridTemplate"
version = "0.1.0"
description = "Description"
authors = [{name = "mohammad rayati", email = "mohammad.rayati@heig-vd.ch"}]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "isort>=6.0.1",
    "black>=25.9.0",
    "pytest>=8.4.2",
    "pre-commit>=4.3.0",
    "pylint>=3.3.8",
    "nbstripout>=0.8.2",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "mypy>=1.16.1",
    "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# uv-specific configuration can be added here if needed
