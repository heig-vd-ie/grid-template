name: Template bootstrap

# Runs once, on the first push after a repo is created from this template, to
# personalise it and remove itself. Guarded so it never touches the template repo.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository != 'heig-vd-ie/psrl-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Personalise the new repository
        env:
          PROJECT_NAME: ${{ github.event.repository.name }}
          AUTHOR: ${{ github.actor }}
        run: bash scripts/template-bootstrap.sh

      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to bootstrap."; exit 0; }
          git commit -m "Bootstrap project from psrl-template"
          git push
